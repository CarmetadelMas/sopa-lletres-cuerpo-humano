<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sopa de lletres — Parts del cos</title><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{min-height:100vh;background:light-dark(#fff8ef,#171411);color:light-dark(#27211c,#f7eee5);padding:28px 18px}.wrap{max-width:850px;margin:auto}.head{text-align:center;margin-bottom:20px}.head h1{margin:0;font-size:clamp(28px,6vw,48px)}.head p{margin:7px 0;color:light-dark(#76675d,#cdbfb4)}.layout{display:grid;grid-template-columns:minmax(320px,1fr) 250px;gap:22px;align-items:start}.card{background:light-dark(#fff,#241e1a);border:1px solid light-dark(#eadfd5,#3a302a);border-radius:22px;padding:18px;box-shadow:0 8px 30px #00000010}.grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;user-select:none;touch-action:none}.cell{aspect-ratio:1;border:0;border-radius:7px;background:light-dark(#f5eee8,#302722);font-weight:800;font-size:clamp(10px,2.6vw,17px);color:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center}.cell.selected{background:#f0b35b;color:#24180e}.cell.found{background:#75c69b;color:#103321}.words{display:grid;gap:8px;margin:0;padding:0;list-style:none}.word{padding:8px 10px;border-radius:10px;background:light-dark(#f7f1ec,#302722);font-weight:700}.word.done{text-decoration:line-through;opacity:.55;background:#75c69b55}.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:15px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:#e99b45;color:#2a190a}.status{font-weight:800}.hint{font-size:13px;color:light-dark(#776b63,#c8bbb2);margin-top:12px;line-height:1.4}@media(max-width:700px){.layout{grid-template-columns:1fr}.grid{gap:2px}.card{padding:12px}.words{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><div class="wrap"><header class="head"><h1>🧩 Sopa de lletres</h1><p>Parts del cos — <b>en castellà</b></p></header><section class="layout"><div class="card"><div id="grid" class="grid" aria-label="Sopa de lletres"></div><div class="controls"><span id="status" class="status">0 / 16 trobades</span><button class="btn" id="reset">Reinicia</button></div><div class="hint">Arrossega des de la primera lletra fins a l'última. Les paraules poden anar en qualsevol direcció.</div></div><aside class="card"><h2>🔎 Paraules</h2><ul id="words" class="words"></ul></aside></section></div></main><script>
const rows=['LZBRAZOHVRQBNYED','JOAIOVJWDPOXAZOO','MJNURQNMXCWNNUMA','CIWIEDTBAURTOLEZ','SNORJSAQBESYXPLE','SQWXAODSILVKEDMB','OJAPUJLPZLQCTBTA','ZCSVGOAWHOHLVEJC','NQRFZNPRBOZKUHNV','PAOOSVSMOURIZOGA','BIPIDCENDRKHRDDQ','WOEBNIYDCEBEJAEM','YNPSSTLWOXDMSJNV','XAEESIGLYSFOOQYU','TMQVDAMXAGDMSHQX','JBARRIGAKACAIAZD'];
const words=['CABEZA','OJOS','NARIZ','BOCA','OREJA','CUELLO','HOMBRO','BRAZO','MANO','DEDOS','PECHO','ESPALDA','BARRIGA','PIERNA','RODILLA','PIE'];
const grid=document.getElementById('grid'), list=document.getElementById('words'), status=document.getElementById('status');let start=null, selecting=false, found=new Set();
rows.forEach((row,r)=>[...row].forEach((ch,c)=>{const b=document.createElement('button');b.className='cell';b.textContent=ch;b.dataset.r=r;b.dataset.c=c;grid.appendChild(b)}));
words.forEach(w=>{const li=document.createElement('li');li.className='word';li.id='w-'+w;li.textContent=w;list.appendChild(li)});
function cellAt(r,c){return grid.querySelector(`[data-r="${r}"][data-c="${c}"]`)}
function line(a,b){const dr=Math.sign(b.r-a.r),dc=Math.sign(b.c-a.c);if(a.r!==b.r&&a.c!==b.c&&Math.abs(b.r-a.r)!==Math.abs(b.c-a.c))return [];let n=Math.max(Math.abs(b.r-a.r),Math.abs(b.c-a.c))+1, out=[];for(let i=0;i<n;i++)out.push({r:a.r+dr*i,c:a.c+dc*i});return out}
function clearSel(){grid.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'))}
function highlight(a,b){clearSel();line(a,b).forEach(p=>cellAt(p.r,p.c)?.classList.add('selected'))}
function finish(end){if(!start)return;let pts=line(start,end), text=pts.map(p=>rows[p.r][p.c]).join(''), rev=[...text].reverse().join('');let w=words.find(x=>!found.has(x)&&(x===text||x===rev));if(w){found.add(w);pts.forEach(p=>cellAt(p.r,p.c)?.classList.add('found'));document.getElementById('w-'+w).classList.add('done');status.textContent=`${found.size} / ${words.length} trobades`;if(found.size===words.length)status.textContent='🎉 Has trobat totes les paraules!'}else clearSel();start=null;selecting=false}
grid.addEventListener('pointerdown',e=>{let b=e.target.closest('.cell');if(!b)return;selecting=true;grid.setPointerCapture(e.pointerId);start={r:+b.dataset.r,c:+b.dataset.c};highlight(start,start)});
grid.addEventListener('pointermove',e=>{if(!selecting)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(el&&grid.contains(el))highlight(start,{r:+el.dataset.r,c:+el.dataset.c})});
grid.addEventListener('pointerup',e=>{if(!selecting)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(el)finish({r:+el.dataset.r,c:+el.dataset.c});else{clearSel();start=null;selecting=false}});
document.getElementById('reset').onclick=()=>{found.clear();clearSel();grid.querySelectorAll('.found').forEach(x=>x.classList.remove('found'));list.querySelectorAll('.done').forEach(x=>x.classList.remove('done'));status.textContent='0 / 16 trobades'};
</script></body></html>
